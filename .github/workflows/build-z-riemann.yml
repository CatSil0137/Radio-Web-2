name: Build Z Riemann Visualizer APK

on:
  push:
    paths:
      - "z-riemann/**"
      - ".github/workflows/build-z-riemann.yml"
    tags: ["z-riemann-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: z-riemann
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: z-riemann/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build www and sync into Android project
        run: npm run sync

      - name: Build APK (debug-signed, installable)
        working-directory: z-riemann/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Z-Riemann-Visualizer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Z-Riemann-Visualizer-apk
          path: z-riemann/dist/Z-Riemann-Visualizer.apk

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/z-riemann-v')
        uses: softprops/action-gh-release@v2
        with:
          files: z-riemann/dist/Z-Riemann-Visualizer.apk
